<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Nth Reader</title>
<meta name="description" content="A personal, offline-first bookshelf and multi-format ebook reader." />
<meta name="theme-color" content="#1b120b" />
<meta name="application-name" content="Nth Reader" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Nth Reader" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<!-- Version the primary manifest URL so Chrome cannot retain an older,
     pre-installable manifest while the app itself has already updated. -->
<link rel="manifest" href="./manifest.webmanifest?v=0.25.02" />
<script>
  // Repair the manifest relationship immediately if Chrome restored a stale
  // cached document shell without its link element.
  window.__nthManifestUrl = "./manifest.webmanifest?v=0.25.02";
  window.__nthEnsureManifestLink = function () {
    let link = document.querySelector('link[rel~="manifest"]');
    if (!link) {
      link = document.createElement("link");
      link.rel = "manifest";
      document.head.appendChild(link);
      window.__nthManifestLinkWasRepaired = true;
    }
    const wanted = new URL(window.__nthManifestUrl, location.href).href;
    if (link.href !== wanted) link.href = wanted;
    return link;
  };
  window.__nthEnsureManifestLink();

  // Capture Chrome's one-shot install event before the larger reader scripts
  // load. A previously active service worker can make this event arrive early.
  window.__nthInstallPrompt = null;
  window.__nthInstallPromptCapturedAt = 0;
  window.addEventListener("beforeinstallprompt", (event) => {
    event.preventDefault();
    window.__nthInstallPrompt = event;
    window.__nthInstallPromptCapturedAt = Date.now();
    window.dispatchEvent(new CustomEvent("nth:installprompt-ready"));
  });

  // Register immediately so first-time visitors can finish service-worker
  // control with the install helper's single safe refresh.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js", {
      scope: "./",
      updateViaCache: "none",
    }).catch((error) => {
      console.warn("Service worker registration failed:", error);
    });
  }
</script>
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png" />
<link rel="stylesheet" href="css/style.css" />
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="js/turn.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  // pdf.js needs its worker; point it at the same CDN build.
  window.addEventListener("load", () => {
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    }
  });
</script>
</head>
<body>

<!-- ===================== SHELF (home) ===================== -->
<main id="shelf-view" class="view active">
  <header class="shelf-header ornate-bookcase-header">
    <button id="remove-open-btn" class="icon-btn" type="button" aria-label="Remove books">
      <span class="hamburger-icon"><span></span><span></span><span></span></span>
    </button>
    <img class="app-header-icon" src="assets/icons/icon-192.png" width="48" height="48" alt="Nth Reader" />
    <button id="menu-open-btn" class="icon-btn" type="button" aria-label="Menu">
      <span class="hamburger-icon"><span></span><span></span><span></span></span>
    </button>
  </header>
  <div id="import-status" class="import-status"></div>
  <div id="shelf-root" class="shelf-root"></div>
  <button id="carousel-open-btn" class="carousel-open-btn" type="button" aria-label="Browse bookcases" aria-hidden="true" disabled>
    <span aria-hidden="true">◫</span><span id="carousel-open-label">Bookcase 1</span>
  </button>

  <section id="bookcase-carousel" class="bookcase-carousel" hidden aria-label="Bookcase carousel">
    <div class="carousel-topline ornate-bookcase-header">
      <div>
        <strong>Your Bookcases</strong>
        <span>Swipe Any Direction</span>
      </div>
      <img class="app-header-icon" src="assets/icons/icon-192.png" width="48" height="48" alt="Nth Reader" />
      <button id="carousel-close-btn" class="carousel-close-btn" type="button" aria-label="Close carousel">✕</button>
    </div>
    <div id="carousel-stage" class="carousel-stage">
      <button id="carousel-prev-btn" class="carousel-arrow carousel-arrow-prev" type="button" aria-label="Previous bookcase">‹</button>
      <button id="carousel-card" class="carousel-card" type="button" aria-label="Open selected bookcase">
        <div id="carousel-preview" class="carousel-bookcase-content shelf-root"></div>
      </button>
      <button id="carousel-next-btn" class="carousel-arrow carousel-arrow-next" type="button" aria-label="Next bookcase">›</button>
    </div>
    <div id="carousel-position" class="carousel-position" aria-live="polite">Bookcase 1 of 1</div>
    <button id="carousel-enter-btn" class="carousel-enter-btn" type="button">Open Bookcase</button>
  </section>

  <!-- Customize mode chrome -->
  <div id="customize-topbar" class="customize-topbar ornate-bookcase-header" hidden>
    <span class="customize-title">Customize Shelf</span>
    <img class="app-header-icon" src="assets/icons/icon-192.png" width="48" height="48" alt="Nth Reader" />
    <button id="customize-done-btn" class="customize-done-btn" type="button">Done</button>
  </div>
  <div id="customize-panel" class="customize-panel" hidden></div>
  <div id="customize-tabbar" class="customize-tabbar" hidden>
    <button class="customize-tab active" type="button" data-tab="arrange">📚<span>Arrange</span></button>
    <button class="customize-tab" type="button" data-tab="decorate">🪴<span>Decorate</span></button>
    <button class="customize-tab" type="button" data-tab="backdrop">🖼️<span>Backdrop</span></button>
    <button class="customize-tab" type="button" data-tab="shelf">🪵<span>Shelf</span></button>
  </div>

  <div id="nth-toast" class="nth-toast" hidden></div>
</main>

<input type="file" id="file-input" multiple hidden
  accept=".cbz,.zip,.cbt,.pdf,.epub,.rtf,.mobi,.pdb,.prc,.fb2,.docx,.odt,.txt,.text,.log,.html,.htm,.xhtml,.md,.markdown,.json,.xml,.opf,.csv,.tsv,.jpg,.jpeg,.png,.gif,.webp,.avif,.bmp,.svg,.cbr,.cb7,.7z,.rar,.iba,.azw,.azw3" />
<input type="file" id="decor-photo-input" accept="image/*" hidden />

<!-- ===================== DECOR PICKER SHEET ===================== -->
<div id="decor-picker-sheet" class="decor-picker-sheet" hidden>
  <div class="decor-picker-handle"></div>
  <div class="decor-picker-title">Add Decor</div>
  <input id="decor-picker-search" class="decor-picker-search" type="search" placeholder="Search decorations" autocomplete="off" />
  <div id="decor-category-tabs" class="decor-category-tabs" aria-label="Decoration categories"></div>
  <div class="decor-picker-grid"></div>
  <button id="decor-picker-cancel" class="decor-picker-cancel" type="button">Cancel</button>
</div>

<!-- ===================== LEFT PANEL: REMOVE BOOKS ===================== -->
<div id="remove-overlay" class="menu-overlay" hidden></div>
<aside id="remove-panel" class="menu-panel menu-panel-left" hidden>
  <div class="menu-panel-header">
    <h2>Remove Books</h2>
    <button id="remove-close-btn" class="icon-btn" type="button" aria-label="Close">✕</button>
  </div>
  <div class="menu-section-label">Your Books</div>
  <div id="remove-book-list" class="menu-book-list"></div>
</aside>

<!-- ===================== RIGHT PANEL: MENU ===================== -->
<div id="menu-overlay" class="menu-overlay" hidden></div>
<aside id="menu-panel" class="menu-panel" hidden>
  <div class="menu-panel-header">
    <h2>Menu</h2>
    <button id="menu-close-btn" class="icon-btn" type="button" aria-label="Close menu">✕</button>
  </div>
  <button id="menu-add-btn" class="menu-action-btn" type="button">+ Add Books</button>
  <button id="menu-install-btn" class="menu-action-btn menu-action-btn-install" type="button">⬇ Install Nth Reader</button>
  <button id="menu-customize-btn" class="menu-action-btn menu-action-btn-secondary" type="button">🎨 Customize Shelf</button>
  <div class="menu-section-label reading-section-label">Currently Reading</div>
  <div id="currently-reading" class="currently-reading"></div>
  <button id="menu-bookmarks-btn" class="menu-action-btn menu-action-btn-secondary bookmarks-panel-btn" type="button">
    <span>🔖 Bookmarks</span><span id="menu-bookmark-count" class="menu-count">0</span>
  </button>
  <div id="menu-bookmark-list" class="menu-bookmark-list" hidden></div>
</aside>

<!-- ===================== PWA INSTALL HELP ===================== -->
<div id="install-overlay" class="install-overlay" hidden></div>
<section id="install-panel" class="install-panel" hidden role="dialog" aria-modal="true" aria-labelledby="install-title">
  <div class="install-panel-icon"><img src="assets/icons/icon-192.png" alt="" /></div>
  <h2 id="install-title">Install Nth Reader</h2>
  <p id="install-message">Checking whether Chrome is ready…</p>
  <div id="install-readiness" class="install-readiness" aria-live="polite"></div>
  <button id="install-primary-btn" class="menu-action-btn" type="button">Check Again</button>
  <button id="install-close-btn" class="menu-action-btn menu-action-btn-secondary" type="button">Not Now</button>
</section>

<!-- ===================== READER ===================== -->
<section id="reader-view" hidden>
  <header class="reader-topbar ornate-bookcase-header">
    <span aria-hidden="true"></span>
    <img class="app-header-icon" src="assets/icons/icon-192.png" width="48" height="48" alt="Nth Reader" />
    <span aria-hidden="true"></span>
  </header>
  <div id="page-viewport" class="page-viewport"></div>
  <div id="flow-viewport" class="flow-viewport" hidden>
    <div id="flow-inner" class="flow-inner"></div>
  </div>
  <div id="reader-chrome" class="reader-chrome visible">
    <button id="reader-prev-btn" class="reader-nav-arrow" type="button" aria-label="Previous page">‹</button>
    <button id="reader-bookmark-btn" class="reader-bookmark-btn" type="button" aria-label="Bookmark this page" aria-pressed="false">♡</button>
    <div class="reader-chrome-center">
      <button id="reader-back-btn" class="reader-back-btn" type="button">‹ Shelf</button>
      <div id="reader-title" class="reader-title"></div>
      <div id="reader-page-label" class="reader-page-label"></div>
    </div>
    <button id="reader-next-btn" class="reader-nav-arrow" type="button" aria-label="Next page">›</button>
  </div>
</section>

<script src="js/db.js"></script>
<script src="js/formats.js"></script>
<script src="js/page-turn.js"></script>
<script src="js/page-mode.js"></script>
<script src="js/epub-page-reader.js"></script>
<script src="js/reader.js"></script>
<script src="js/decor-art.js"></script>
<script src="js/shelf.js"></script>
<script src="js/carousel.js"></script>
<script src="js/customize.js"></script>
<script src="js/menu.js"></script>
<script src="js/remove-panel.js"></script>
<script src="js/app.js"></script>
<script src="js/pwa-install.js"></script>
</body>
</html>
