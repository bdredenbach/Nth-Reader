<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Nth Reader</title>
<meta name="theme-color" content="#1b120b" />
<link rel="stylesheet" href="css/style.css" />
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="js/turn.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  // pdf.js needs its worker; point it at the same CDN build.
  window.addEventListener("load", () => {
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    }
  });
</script>
</head>
<body>

<!-- ===================== SHELF (home) ===================== -->
<main id="shelf-view" class="view active">
  <header class="shelf-header">
    <button id="remove-open-btn" class="icon-btn" type="button" aria-label="Remove books">
      <span class="hamburger-icon"><span></span><span></span><span></span></span>
    </button>
    <h1>Nth Reader</h1>
    <button id="menu-open-btn" class="icon-btn" type="button" aria-label="Menu">
      <span class="hamburger-icon"><span></span><span></span><span></span></span>
    </button>
  </header>
  <div id="import-status" class="import-status"></div>
  <div id="shelf-root" class="shelf-root"></div>

  <!-- Customize mode chrome -->
  <div id="customize-topbar" class="customize-topbar" hidden>
    <span class="customize-title">Customize Shelf</span>
    <button id="customize-done-btn" class="customize-done-btn" type="button">Done</button>
  </div>
  <div id="customize-panel" class="customize-panel" hidden></div>
  <div id="customize-tabbar" class="customize-tabbar" hidden>
    <button class="customize-tab active" type="button" data-tab="arrange">📚<span>Arrange</span></button>
    <button class="customize-tab" type="button" data-tab="decorate">🪴<span>Decorate</span></button>
    <button class="customize-tab" type="button" data-tab="backdrop">🖼️<span>Backdrop</span></button>
    <button class="customize-tab" type="button" data-tab="shelf">🪵<span>Shelf</span></button>
  </div>

  <div id="nth-toast" class="nth-toast" hidden></div>
</main>

<input type="file" id="file-input" multiple hidden
  accept=".cbz,.zip,.cbt,.pdf,.epub,.rtf,.mobi,.cbr,.cb7,.7z,.rar,.iba,.azw,.azw3" />

<!-- ===================== DECOR PICKER SHEET ===================== -->
<div id="decor-picker-sheet" class="decor-picker-sheet" hidden>
  <div class="decor-picker-handle"></div>
  <div class="decor-picker-title">Add Decor</div>
  <div class="decor-picker-grid">
    <button class="decor-pick-btn" type="button" data-type="bust"><span>🗿</span>Bust</button>
    <button class="decor-pick-btn" type="button" data-type="globe"><span>🌍</span>Globe</button>
    <button class="decor-pick-btn" type="button" data-type="plant"><span>🪴</span>Plant</button>
    <button class="decor-pick-btn" type="button" data-type="candle"><span>🕯️</span>Candle</button>
  </div>
  <button id="decor-picker-cancel" class="decor-picker-cancel" type="button">Cancel</button>
</div>

<!-- ===================== LEFT PANEL: REMOVE BOOKS ===================== -->
<div id="remove-overlay" class="menu-overlay" hidden></div>
<aside id="remove-panel" class="menu-panel menu-panel-left" hidden>
  <div class="menu-panel-header">
    <h2>Remove Books</h2>
    <button id="remove-close-btn" class="icon-btn" type="button" aria-label="Close">✕</button>
  </div>
  <div class="menu-section-label">Your Books</div>
  <div id="remove-book-list" class="menu-book-list"></div>
</aside>

<!-- ===================== RIGHT PANEL: MENU ===================== -->
<div id="menu-overlay" class="menu-overlay" hidden></div>
<aside id="menu-panel" class="menu-panel" hidden>
  <div class="menu-panel-header">
    <h2>Menu</h2>
    <button id="menu-close-btn" class="icon-btn" type="button" aria-label="Close menu">✕</button>
  </div>
  <button id="menu-add-btn" class="menu-action-btn" type="button">+ Add Books</button>
  <button id="menu-customize-btn" class="menu-action-btn menu-action-btn-secondary" type="button">🎨 Customize Shelf</button>
</aside>

<!-- ===================== READER ===================== -->
<section id="reader-view" hidden>
  <div id="page-viewport" class="page-viewport"></div>
  <div id="flow-viewport" class="flow-viewport" hidden>
    <div id="flow-inner" class="flow-inner"></div>
  </div>
  <div id="reader-chrome" class="reader-chrome visible">
    <button id="reader-prev-btn" class="reader-nav-arrow" type="button" aria-label="Previous page">‹</button>
    <div class="reader-chrome-center">
      <button id="reader-back-btn" class="reader-back-btn" type="button">‹ Shelf</button>
      <div id="reader-title" class="reader-title"></div>
      <div id="reader-page-label" class="reader-page-label"></div>
    </div>
    <button id="reader-next-btn" class="reader-nav-arrow" type="button" aria-label="Next page">›</button>
  </div>
</section>

<script src="js/db.js"></script>
<script src="js/formats.js"></script>
<script src="js/page-turn.js"></script>
<script src="js/page-mode.js"></script>
<script src="js/reader.js"></script>
<script src="js/shelf.js"></script>
<script src="js/customize.js"></script>
<script src="js/menu.js"></script>
<script src="js/remove-panel.js"></script>
<script src="js/app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch((err) => {
        console.warn("Service worker registration failed:", err);
      });
    });
  }
</script>
</body>
</html>
