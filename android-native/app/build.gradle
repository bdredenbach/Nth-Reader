plugins { id "com.android.application" }

def releaseSigning = [
    storeFile: System.getenv("ANDROID_KEYSTORE_FILE"),
    storePassword: System.getenv("ANDROID_KEYSTORE_PASSWORD"),
    keyAlias: System.getenv("ANDROID_KEY_ALIAS"),
    keyPassword: System.getenv("ANDROID_KEY_PASSWORD")
]
def releaseSigningConfigured = releaseSigning.values().every { value ->
    value != null && !value.trim().isEmpty()
}
def androidStudioSigningConfigured = [
    "android.injected.signing.store.file",
    "android.injected.signing.store.password",
    "android.injected.signing.key.alias",
    "android.injected.signing.key.password"
].every { propertyName -> project.hasProperty(propertyName) }

android {
    namespace "com.nthreader.app"
    compileSdk 36

    defaultConfig {
        applicationId "com.nthreader.app"
        minSdk 26
        targetSdk 36
        versionCode 10005
        versionName "1.0.5"
    }

    signingConfigs {
        if (releaseSigningConfigured) {
            create("release") {
                storeFile file(releaseSigning.storeFile)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".preview3812"
            versionNameSuffix "-preview"
        }
        release {
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.getByName("release")
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

tasks.matching { task ->
    task.name == "bundleRelease" || task.name == "assembleRelease"
}.configureEach {
    doFirst {
        if (!releaseSigningConfigured && !androidStudioSigningConfigured) {
            throw new GradleException(
                "Release signing is not configured. Use Android Studio's signed bundle wizard " +
                "or provide the ANDROID_KEYSTORE_* environment variables."
            )
        }
    }
}

// Every APK/AAB contains the exact web app from this checkout. No hosted shell.
def bundledWebDir = layout.buildDirectory.dir("generated/nthWebAssets")
def bundleWebApp = tasks.register("bundleWebApp", Sync) {
    from(rootProject.projectDir.parentFile) {
        include "privacy.html", "index.html", "manifest.json", "manifest.webmanifest", "sw.js"
        include "css/**", "js/**", "assets/**", "THIRD_PARTY_NOTICES.txt"
        exclude "js/turn.js", "js/turnjs-license.txt"
    }
    into(bundledWebDir.map { it.dir("web") })
}
android.sourceSets.main.assets.srcDir(bundledWebDir)
tasks.named("preBuild").configure { dependsOn(bundleWebApp) }
