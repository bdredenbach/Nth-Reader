plugins { id "com.android.application" }

android {
    namespace "com.nthreader.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.nthreader.app"
        minSdk 26
        targetSdk 35
        versionCode 3202
        versionName "0.32.02"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}
