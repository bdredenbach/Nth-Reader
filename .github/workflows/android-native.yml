name: Android native reader

on:
  workflow_dispatch:
  push:
    branches: [Android]
    paths:
      - "android-native/**"
      - "js/native-narrator.js"
      - "js/native-widget.js"
      - "js/voice-reader.js"
      - "js/reader.js"
      - "js/app.js"
      - "sw.js"
      - "index.html"

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36"
      - name: Build debug APK
        run: gradle -p android-native --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Nth-Reader-Android-debug
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
